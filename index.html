<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chess Opening Quiz</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon.ico">
    <link rel="apple-touch-icon" href="images/icon.png">
    <meta name="theme-color" content="#262421">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

    <style>
        * { box-sizing: border-box; user-select: none; }
        body { margin: 0; padding: 0; background-color: #262421; color: #dcdcdc; font-family: 'Noto Sans KR', sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; overflow-x: hidden; }
        
        #header { width: 100%; padding: 15px; text-align: center; background-color: #302e2b; border-bottom: 2px solid #4e623b; }
        #opening-name { font-size: 16px; font-weight: bold; color: #f1c40f; min-height: 24px; }
        #status-msg { font-size: 14px; margin-top: 5px; color: #a0d959; }

        #main-container { display: flex; flex-direction: row; width: 100%; max-width: 900px; margin: 15px auto 10px auto; padding: 0 10px; justify-content: center; align-items: flex-start; }

        #board-wrapper { flex: 0 0 auto; width: 100%; max-width: 600px; position: relative; aspect-ratio: 1/1; background-image: url('images/3dboard.png'); background-size: 100% 100%; }
        
        .piece, .highlight { position: absolute; background-size: 100% 100%; transition: left 0.15s linear, top 0.15s linear; pointer-events: none; }
        .piece { width: 12.5%; height: 22.7272%; }
        .highlight { width: 12.5%; height: 11.3636%; opacity: 0.5; z-index: 0; }
        
        #touch-grid { position: absolute; top: 9.23295%; left: 0; width: 100%; height: 90.767%; display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr); z-index: 100; }
        .touch-square { width: 100%; height: 100%; }

        #notation-wrapper { flex: 1 1 250px; background-color: #302e2b; border: 2px solid #4e623b; border-radius: 8px; margin-left: 15px; display: flex; flex-direction: column; height: 100%; min-height: 300px; max-height: 600px; overflow: hidden; }
        #notation-header { background-color: #4e623b; color: white; font-weight: bold; padding: 10px; text-align: center; font-size: 15px; }
        #notation-body { flex: 1; overflow-y: auto; padding: 10px; font-size: 15px; line-height: 1.6; color: #dcdcdc; text-align: left; }
        .move-row { display: flex; margin-bottom: 4px; border-bottom: 1px solid #444; padding-bottom: 2px; }
        .move-num { width: 45px; color: #7f8c8d; font-weight: bold; }
        .move-w { flex: 1; color: #7f8c8d; font-weight: bold; }
        .move-b { flex: 1; color: #7f8c8d; font-weight: bold; }
        
        #controls { width: 100%; text-align: center; padding: 10px 10px 5px 10px; }
        button { background-color: #8c8c8c; color: #ffd700; text-shadow: 1px 1px 2px rgba(0,0,0,0.6); border: none; padding: 14px 24px; font-size: 16px; border-radius: 8px; font-weight: bold; cursor: pointer; margin: 0 5px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        button:active { background-color: #737373; transform: translateY(2px); box-shadow: 0 2px 3px rgba(0,0,0,0.3); }
        .btn-black { background-color: #4a4a4a; }
        .btn-black:active { background-color: #2b2b2b; }

        #extra-controls { text-align: center; margin-bottom: 20px; }

        #loading { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #262421; color: white; display: flex; align-items: center; justify-content: center; z-index: 999; font-size: 18px; font-weight: bold; flex-direction: column; }

        @media (max-width: 768px) {
            #main-container { flex-direction: column; align-items: center; }
            #board-wrapper { width: 100%; max-width: 100%; }
            #notation-wrapper { width: 100%; margin-left: 0; margin-top: 15px; height: 180px; min-height: auto; }
        }
    </style>
</head>
<body>

    <div id="loading">
        <div id="loading-text">최적화된 라이브러리 불러오는 중...</div>
    </div>

    <div id="header">
        <div id="opening-name">Starting Position</div>
        <div id="status-msg">원하는 색상을 선택해 퀴즈를 시작하세요!</div>
    </div>

    <div id="main-container">
        <div id="board-wrapper">
            <div id="pieces-container"></div>
            <div id="highlights-container"></div>
            <div id="touch-grid"></div>
        </div>

        <div id="notation-wrapper">
            <div id="notation-header">기보 (Notation)</div>
            <div id="notation-body" id="notation-body"></div>
        </div>
    </div>

    <div id="controls">
        <button onclick="startGame('w')">백으로 연습</button>
        <button class="btn-black" onclick="startGame('b')">흑으로 연습</button>
    </div>

    <div id="extra-controls">
        <label style="color: #dcdcdc; font-size: 15px; margin-right: 15px; cursor: pointer;">
            <input type="checkbox" id="auto-reset" style="vertical-align: middle; width: 16px; height: 16px;"> 자동 리셋
        </label>
        <button onclick="copyPGN()" style="padding: 8px 16px; font-size: 14px; background-color: #27ae60; color: white; text-shadow: none;">📋 PGN 복사</button>
        <!-- [신규] 기보 감상 버튼 -->
        <button id="replay-btn" onclick="startReplay()" style="display: none; padding: 8px 16px; font-size: 14px; background-color: #f39c12; color: white; text-shadow: none;">🎬 기보 감상</button>
        <button id="install-btn" style="display: none; padding: 8px 16px; font-size: 14px; background-color: #e67e22; color: white; text-shadow: none;">📲 앱 설치</button>
    </div>

    <script>
        let game;
        let fullGame; 
        try { 
            game = new Chess(); 
            fullGame = new Chess();
        } catch(e) { alert("체스 엔진 로딩 실패."); }
        
        let combinedTree = {};
        let optimizedEcoDict = {}; 
        let userColor = 'w';
        let isFlipped = false;
        let selectedSquare = null;
        let lastMove = null;
        let isWaitingForComputer = false;
        
        let globalStartFen = "rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1";
        let globalPosName = "Starting Position"; 

        // [신규] 기보 감상 및 자동 리셋 타이머 관리를 위한 변수들
        let isReplaying = false;
        let autoResetTimeoutId = null;
        let replayTimeoutId = null;

        const sndMove = new Audio('sounds/sound_move.wav');
        const sndCapture = new Audio('sounds/sound_capture.wav');
        const sndError = new Audio('sounds/sound_capture.wav');

        function getBaseFen(fen) {
            return fen.split(' ').slice(0, 3).join(' ');
        }

        function syncFullGame() {
            fullGame.reset();
            if (globalPosName && globalPosName !== "Starting Position") {
                let tokens = globalPosName.split(/\s+/);
                for (let t of tokens) {
                    let san = t.replace(/^\d+\.+/, ""); 
                    if (san) {
                        try { fullGame.move(san); } catch(e) {}
                    }
                }
            }
        }

        function copyPGN() {
            let pgnText = fullGame.pgn();
            if (!pgnText) {
                alert("복사할 기보가 없습니다.");
                return;
            }
            
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(pgnText).then(() => alert("PGN 텍스트가 복사되었습니다!"));
            } else {
                let textArea = document.createElement("textarea");
                textArea.value = pgnText;
                textArea.style.position = "fixed";
                textArea.style.left = "-999999px";
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();
                try { document.execCommand('copy'); alert("PGN 텍스트가 복사되었습니다!"); } 
                catch (err) { alert("복사에 실패했습니다."); }
                textArea.remove();
            }
        }

        // --- 기보 감상 (Replay) 시스템 ---
        function startReplay() {
            if (autoResetTimeoutId) {
                clearTimeout(autoResetTimeoutId);
                autoResetTimeoutId = null;
            }
            
            isReplaying = true;
            document.getElementById('replay-btn').style.display = 'none';
            document.getElementById('status-msg').innerText = "기보 감상 중...";
            document.getElementById('status-msg').style.color = "#f39c12";

            let moves = fullGame.history();
            
            // 시각적 효과를 극대화하기 위해 완전한 초기 보드(Standard Start)에서부터 시작합니다.
            game.reset();
            fullGame.reset();
            
            selectedSquare = null;
            lastMove = null;
            
            let moveIndex = 0;
            
            function playNextMove() {
                if (!isReplaying) return; // 중간에 연습 버튼을 눌러 인터럽트 된 경우 정지
                
                if (moveIndex >= moves.length) {
                    isReplaying = false;
                    document.getElementById('status-msg').innerText = "기보 감상이 끝났습니다. 연습 버튼을 눌러 다시 시작하세요.";
                    document.getElementById('status-msg').style.color = "#3498db";
                    return;
                }
                
                let san = moves[moveIndex];
                let moveObj = game.move(san);
                fullGame.move(san);
                lastMove = moveObj;
                
                playSound(moveObj.captured ? 'capture' : 'move');
                updateUI();
                
                // updateUI가 상태 메시지를 덮어씌우는 것을 방지하고 감상 중 텍스트를 강제 유지
                document.getElementById('status-msg').innerText = "기보 감상 중... (" + (moveIndex + 1) + "/" + moves.length + ")";
                document.getElementById('status-msg').style.color = "#f39c12";
                
                moveIndex++;
                replayTimeoutId = setTimeout(playNextMove, 1500); // 1.5초 간격으로 자동 재생
            }
            
            updateUI();
            document.getElementById('status-msg').innerText = "기보 감상 준비 중...";
            document.getElementById('status-msg').style.color = "#f39c12";
            
            replayTimeoutId = setTimeout(playNextMove, 1000);
        }

        // --- PWA 앱 설치 로직 ---
        let deferredPrompt;
        const installBtn = document.getElementById('install-btn');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault(); 
            deferredPrompt = e; 
            installBtn.style.display = 'inline-block'; 
        });

        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt(); 
                const { outcome } = await deferredPrompt.userChoice;
                deferredPrompt = null;
                installBtn.style.display = 'none'; 
            }
        });

        window.addEventListener('appinstalled', () => {
            deferredPrompt = null;
            installBtn.style.display = 'none';
        });
        // -----------------------

        async function loadData() {
            try {
                const [libRes, ecoRes] = await Promise.all([
                    fetch('library_data.json'),
                    fetch('optimized_eco.json') 
                ]);
                const libData = await libRes.json();
                optimizedEcoDict = await ecoRes.json();

                if (libData.folders) {
                    for (let fk in libData.folders) {
                        if (libData.folders[fk].start_fen) {
                            globalStartFen = libData.folders[fk].start_fen;
                            if (libData.folders[fk].metadata && libData.folders[fk].metadata.pos_name) {
                                globalPosName = libData.folders[fk].metadata.pos_name;
                            }
                            break;
                        }
                    }
                }

                for (let folderKey in libData.tree) {
                    let fens = libData.tree[folderKey];
                    for (let fen in fens) {
                        let baseFen = getBaseFen(fen);
                        if (!combinedTree[baseFen]) combinedTree[baseFen] = {};
                        for (let san in fens[fen]) {
                            combinedTree[baseFen][san] = true;
                        }
                    }
                }
                
                document.getElementById('loading').style.display = 'none';
                
                game.load(globalStartFen);
                syncFullGame(); 
                
                createTouchGrid();
                updateUI();
                document.getElementById('status-msg').innerText = "원하는 색상을 선택해 퀴즈를 시작하세요!";
                document.getElementById('status-msg').style.color = "#dcdcdc";

            } catch (e) {
                document.getElementById('loading').innerHTML = "데이터 로딩 실패!<br><br><span style='font-size:14px;color:#e74c3c;'>인터넷 상태 확인 후 새로고침 하세요.</span>";
            }
        }

        function createTouchGrid() {
            const grid = document.getElementById('touch-grid');
            grid.innerHTML = '';
            for (let row = 0; row < 8; row++) {
                for (let col = 0; col < 8; col++) {
                    let sqDiv = document.createElement('div');
                    sqDiv.className = 'touch-square';
                    
                    let file = isFlipped ? 7 - col : col;
                    let rank = isFlipped ? row : 7 - row;
                    let sq = String.fromCharCode(97 + file) + (rank + 1);
                    
                    sqDiv.dataset.sq = sq;
                    sqDiv.addEventListener('click', () => handleSquareClick(sq));
                    grid.appendChild(sqDiv);
                }
            }
        }

        function startGame(color) {
            // 진행 중이던 타이머와 감상 모드를 즉시 리셋
            if (autoResetTimeoutId) { clearTimeout(autoResetTimeoutId); autoResetTimeoutId = null; }
            if (replayTimeoutId) { clearTimeout(replayTimeoutId); replayTimeoutId = null; }
            isReplaying = false;
            document.getElementById('replay-btn').style.display = 'none';

            userColor = color;
            isFlipped = (color === 'b');
            
            game.load(globalStartFen);
            syncFullGame(); 
            
            selectedSquare = null;
            lastMove = null;
            isWaitingForComputer = false;
            
            createTouchGrid();
            
            let currentTurn = game.turn();
            if (userColor !== currentTurn) {
                isWaitingForComputer = true;
                updateUI(); 
                document.getElementById('status-msg').innerText = "컴퓨터가 시작합니다...";
                document.getElementById('status-msg').style.color = "#a0d959";
                setTimeout(makeComputerMove, 400);
            } else {
                updateUI();
                document.getElementById('status-msg').innerText = "당신의 차례입니다. 올바른 오프닝 수를 두세요.";
                document.getElementById('status-msg').style.color = "#a0d959";
            }
        }

        function handleSquareClick(sq) {
            // 기보 감상 모드 중일 때도 터치를 방어합니다.
            if (isWaitingForComputer || game.game_over() || isReplaying) return;

            let piece = game.get(sq);

            if (selectedSquare === null) {
                if (piece && piece.color === userColor) {
                    selectedSquare = sq;
                    renderBoard();
                }
            } else if (selectedSquare === sq) {
                selectedSquare = null;
                renderBoard();
            } else {
                let moves = game.moves({ verbose: true });
                let moveObj = moves.find(m => m.from === selectedSquare && m.to === sq);
                
                if(!moveObj && piece && piece.type === 'p' && (sq[1] === '1' || sq[1] === '8')) {
                    moveObj = moves.find(m => m.from === selectedSquare && m.to === sq && m.promotion === 'q');
                }

                if (moveObj) {
                    let fenBefore = getBaseFen(game.fen());
                    let sanMove = moveObj.san;

                    if (combinedTree[fenBefore] && combinedTree[fenBefore][sanMove]) {
                        game.move(moveObj);
                        fullGame.move(sanMove); 
                        
                        lastMove = moveObj;
                        selectedSquare = null;
                        playSound(moveObj.captured ? 'capture' : 'move');
                        
                        let newFen = getBaseFen(game.fen());
                        if (combinedTree[newFen] && Object.keys(combinedTree[newFen]).length > 0) {
                            isWaitingForComputer = true;
                            updateUI();
                            document.getElementById('status-msg').innerText = "정답! (컴퓨터의 응수를 기다립니다...)";
                            document.getElementById('status-msg').style.color = "#a0d959";
                            setTimeout(makeComputerMove, 500);
                        } else {
                            isWaitingForComputer = true; 
                            document.getElementById('replay-btn').style.display = 'inline-block'; // 감상 버튼 등장
                            updateUI();
                            
                            let isAuto = document.getElementById('auto-reset').checked;
                            if (isAuto) {
                                document.getElementById('status-msg').innerText = "🎉 라인 마스터! (1.5초 후 다시 시작합니다)";
                                document.getElementById('status-msg').style.color = "#f1c40f";
                                autoResetTimeoutId = setTimeout(() => startGame(userColor), 1500);
                            } else {
                                document.getElementById('status-msg').innerText = "🎉 준비된 오프닝 라인의 끝에 도달했습니다!";
                                document.getElementById('status-msg').style.color = "#3498db";
                            }
                        }
                    } else {
                        selectedSquare = null;
                        renderBoard();
                        sndError.play();
                        document.getElementById('status-msg').innerText = `❌ 틀렸습니다! (${sanMove}는 지정된 라인이 아님)`;
                        document.getElementById('status-msg').style.color = "#e74c3c";
                    }
                } else {
                    if (piece && piece.color === userColor) {
                        selectedSquare = sq;
                        renderBoard();
                    } else {
                        selectedSquare = null;
                        renderBoard();
                    }
                }
            }
        }

        function makeComputerMove() {
            let currentFen = getBaseFen(game.fen());
            if (!combinedTree[currentFen]) {
                isWaitingForComputer = false;
                return;
            }

            let possibleSans = Object.keys(combinedTree[currentFen]);
            if (possibleSans.length === 0) {
                isWaitingForComputer = false;
                return;
            }

            let randomSan = possibleSans[Math.floor(Math.random() * possibleSans.length)];
            let moveObj = game.move(randomSan);
            fullGame.move(randomSan); 

            lastMove = moveObj;
            playSound(moveObj.captured ? 'capture' : 'move');
            
            isWaitingForComputer = false;
            
            let nextFen = getBaseFen(game.fen());
            if (!combinedTree[nextFen] || Object.keys(combinedTree[nextFen]).length === 0) {
                isWaitingForComputer = true; 
                document.getElementById('replay-btn').style.display = 'inline-block'; // 감상 버튼 등장
                updateUI();
                
                let isAuto = document.getElementById('auto-reset').checked;
                if (isAuto) {
                    document.getElementById('status-msg').innerText = "🎉 라인 마스터! (1.5초 후 다시 시작합니다)";
                    document.getElementById('status-msg').style.color = "#f1c40f";
                    autoResetTimeoutId = setTimeout(() => startGame(userColor), 1500);
                } else {
                    document.getElementById('status-msg').innerText = "🎉 준비된 오프닝 라인의 끝에 도달했습니다!";
                    document.getElementById('status-msg').style.color = "#3498db";
                }
            } else {
                updateUI();
                document.getElementById('status-msg').innerText = "당신의 차례입니다. 올바른 오프닝 수를 두세요.";
                document.getElementById('status-msg').style.color = "#a0d959";
            }
        }

        function playSound(type) {
            try {
                if (type === 'capture') { sndCapture.currentTime = 0; sndCapture.play(); }
                else { sndMove.currentTime = 0; sndMove.play(); }
            } catch(e) {}
        }

        function renderBoard() {
            const pCont = document.getElementById('pieces-container');
            const hCont = document.getElementById('highlights-container');
            pCont.innerHTML = '';
            hCont.innerHTML = '';

            let boardHtml = '';
            let hlHtml = '';

            if (lastMove) {
                hlHtml += getHighlightHTML(lastMove.from, "#f39c12");
                hlHtml += getHighlightHTML(lastMove.to, "#f39c12");
            }
            if (selectedSquare) {
                hlHtml += getHighlightHTML(selectedSquare, "#27ae60");
            }

            for (let screenRow = 0; screenRow < 8; screenRow++) {
                for (let screenCol = 0; screenCol < 8; screenCol++) {
                    let rank = isFlipped ? screenRow : 7 - screenRow;
                    let file = isFlipped ? 7 - screenCol : screenCol;
                    let sq = String.fromCharCode(97 + file) + (rank + 1);
                    
                    let piece = game.get(sq);
                    if (piece) {
                        let c = piece.color;
                        let sym = piece.type;
                        let imgName = `3d${c}${sym}.png`;
                        
                        if (isFlipped && sym === 'n') {
                            imgName = `3d${c}nr.png`;
                        }

                        let leftPct = screenCol * 12.5;
                        let topPct = 9.23295 + (screenRow * 11.36363) - 11.36363;
                        let zIndex = screenRow + 10;

                        boardHtml += `<div class="piece" style="left: ${leftPct}%; top: ${topPct}%; z-index: ${zIndex}; background-image: url('images/${imgName}');"></div>`;
                    }
                }
            }

            pCont.innerHTML = boardHtml;
            hCont.innerHTML = hlHtml;
        }

        function getHighlightHTML(sq, color) {
            let file = sq.charCodeAt(0) - 97;
            let rank = parseInt(sq[1]) - 1;
            
            let screenCol = isFlipped ? 7 - file : file;
            let screenRow = isFlipped ? rank : 7 - rank;
            
            let leftPct = screenCol * 12.5;
            let topPct = 9.23295 + (screenRow * 11.36363);

            return `<div class="highlight" style="left: ${leftPct}%; top: ${topPct}%; background-color: ${color};"></div>`;
        }

        function updateNotation() {
            let history = fullGame.history();
            let html = '';
            for (let i = 0; i < history.length; i += 2) {
                let num = (i / 2) + 1;
                let wMove = history[i];
                let bMove = history[i + 1] ? history[i + 1] : '';
                html += `<div class="move-row">
                    <div class="move-num">${num}.</div>
                    <div class="move-w">${wMove}</div>
                    <div class="move-b">${bMove}</div>
                </div>`;
            }
            const body = document.getElementById('notation-body');
            body.innerHTML = html;
            body.scrollTop = body.scrollHeight; 
        }

        function updateUI() {
            renderBoard();
            updateNotation(); 

            if (!isReplaying) {
                if (isWaitingForComputer && document.getElementById('status-msg').innerText.indexOf('다시 시작') === -1 && document.getElementById('status-msg').innerText.indexOf('마스터') === -1 && document.getElementById('status-msg').innerText.indexOf('도달') === -1) {
                    document.getElementById('status-msg').innerText = "컴퓨터가 응수하는 중...";
                    document.getElementById('status-msg').style.color = "#a0d959";
                } else if (!game.game_over() && document.getElementById('status-msg').innerText.indexOf('완수') === -1 && document.getElementById('status-msg').innerText.indexOf('도달') === -1 && document.getElementById('status-msg').innerText.indexOf('다시 시작') === -1 && document.getElementById('status-msg').innerText.indexOf('마스터') === -1) {
                    document.getElementById('status-msg').innerText = "당신의 차례입니다. 올바른 오프닝 수를 두세요.";
                    document.getElementById('status-msg').style.color = "#a0d959";
                }
            }

            let history = fullGame.history(); 
            let seq = [];
            for (let i = 0; i < history.length; i++) {
                if (i % 2 === 0) seq.push(`${(i/2)+1}. ${history[i]}`);
                else seq[seq.length-1] += ` ${history[i]}`;
            }
            let currentSeqStr = seq.join(" ");

            let bestMatchName = globalPosName; 

            if (currentSeqStr !== "") {
                let moveArr = currentSeqStr.split(" ");
                let testSeq = "";
                for (let i = 0; i < moveArr.length; i++) {
                    testSeq += (i > 0 ? " " : "") + moveArr[i];
                    if (optimizedEcoDict[testSeq]) {
                        let eco = optimizedEcoDict[testSeq][0];
                        let name = optimizedEcoDict[testSeq][1];
                        bestMatchName = `[${eco} ${name}]`;
                    }
                }
            }
            document.getElementById('opening-name').innerText = bestMatchName;
        }

        loadData();
    </script>

    <script>
        if ('serviceWorker' in navigator) { 
            navigator.serviceWorker.register('sw.js').catch(err => console.log('SW 실패:', err)); 
        }
    </script>
</body>
</html>
